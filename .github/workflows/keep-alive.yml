name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping Render Backend
        run: |
          curl -f https://your-backend-url.onrender.com/health || echo "Ping failed"
        
      - name: Log Status
        run: echo "Pinged backend at $(date)"